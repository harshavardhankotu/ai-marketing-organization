name: Deploy Cloudflare Cron Worker

on:
  push:
    branches:
      - main
      - feat/general-purpose-multi-tenant
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build backend
        run: npm run build --workspace=packages/backend

      - name: Run backend tests
        run: npm test --workspace=packages/backend

  deploy-cron-worker:
    name: Deploy Cloudflare Worker
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only deploy if Cloudflare secrets are configured
    if: |
      github.ref == 'refs/heads/main' &&
      secrets.CLOUDFLARE_API_TOKEN != '' &&
      secrets.CLOUDFLARE_ACCOUNT_ID != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Install worker dependencies
        working-directory: packages/cloudflare-worker
        run: npm install --ignore-scripts || true

      - name: Deploy Cloudflare Worker
        working-directory: packages/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Smoke test - Backend /health
        if: env.BACKEND_URL != ''
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://ai-marketing-organization.onrender.com' }}
        run: |
          echo "Running smoke test against $BACKEND_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health" --max-time 30 || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ /api/health returned 200 OK"
          elif [ "$HTTP_STATUS" = "000" ]; then
            echo "⚠️  /api/health timed out — Render may be cold-starting (expected on free tier)"
          else
            echo "❌ /api/health returned $HTTP_STATUS — unexpected"
            exit 1
          fi

      - name: Smoke test - Cron status
        if: env.BACKEND_URL != '' && env.CRON_PING_SECRET != ''
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://ai-marketing-organization.onrender.com' }}
          CRON_PING_SECRET: ${{ secrets.CRON_PING_SECRET }}
        run: |
          echo "Checking cron status..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/v1/cron/status" \
            -H "X-Cron-Secret: $CRON_PING_SECRET" --max-time 30 || echo "000")
          echo "Cron status HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ /api/v1/cron/status OK"
          elif [ "$HTTP_STATUS" = "000" ]; then
            echo "⚠️  Cron status timed out (cold start)"
          else
            echo "⚠️  Cron status returned $HTTP_STATUS"
          fi
