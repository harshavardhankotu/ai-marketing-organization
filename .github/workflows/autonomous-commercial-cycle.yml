name: Autonomous Operations & SLA Verification

on:
  schedule:
    - cron: '30 3,15 * * *' # Twice daily at 09:00 IST (03:30 UTC) & 21:00 IST (15:30 UTC) matching commercial windows
  workflow_dispatch:

jobs:
  verify-commercial-operations:
    name: Verify Queue Health & Commercial SLAs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Commercial Audit & Observability Verification
        run: node scripts/run-autonomous-commercial-cycle.mjs
        env:
          BACKEND_URL: 'https://ai-marketing-organization.onrender.com'
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
          CRON_PING_SECRET: ${{ secrets.CRON_PING_SECRET }}
