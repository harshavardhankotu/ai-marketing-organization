name: Deploy Published Guides to Firebase Hosting

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  repository_dispatch:
    types: [publish-guides]
  workflow_dispatch:

jobs:
  deploy-guides:
    name: Build & Deploy Static Catalog to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Published Guides in D1 & Build Static Site
        id: build-guides
        run: |
          node scripts/prepare-deploy-guides.mjs --allow-empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}

      - name: Check Firebase Deployment Credentials
        id: check-firebase
        run: |
          if [ "${{ steps.build-guides.outputs.skipped }}" = "true" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No published guides to deploy; skipping Firebase deployment."
          elif [ "$HAS_KEY" = "true" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy skipped: key missing"
            echo "::error::BLOCKED: FIREBASE_SERVICE_ACCOUNT is missing but published guides exist to deploy."
            exit 1
          fi
        env:
          HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: gen-lang-client-0916255372
        if: steps.build-guides.outputs.skipped != 'true' && steps.check-firebase.outputs.can_deploy == 'true'

      - name: Post-Deploy Smoke Test
        run: |
          node scripts/post-deploy-smoke-test.mjs
        env:
          PUBLIC_SITE_URL: 'https://gen-lang-client-0916255372.web.app'
        if: steps.build-guides.outputs.skipped != 'true' && steps.check-firebase.outputs.can_deploy == 'true'
