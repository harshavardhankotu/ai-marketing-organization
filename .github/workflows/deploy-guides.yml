name: Deploy Published Guides to Firebase Hosting

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  repository_dispatch:
    types: [publish-guides]
  workflow_dispatch:

jobs:
  deploy-guides:
    name: Build & Deploy Static Catalog to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Published Guides in D1 & Build Static Site
        run: |
          npx tsx scripts/prepare-deploy-guides.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ai-marketing-organization
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
