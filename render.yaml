services:
  - type: web
    runtime: docker
    name: ai-marketing-organization
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: CRON_PING_SECRET
        sync: false
      - key: OWNER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
