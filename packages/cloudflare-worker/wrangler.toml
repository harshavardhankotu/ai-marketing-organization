name = "ai-marketing-cron-worker"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = ["*/15 * * * *"]

# Environment variables (non-secret)
[vars]
BACKEND_URL = "https://ai-marketing-organization.onrender.com"

# Secrets must be added via: wrangler secret put CRON_PING_SECRET
# Never hardcode CRON_PING_SECRET here
